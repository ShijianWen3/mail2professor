<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mail2professor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --ink: #1a1814;
      --ink-mid: #4a4640;
      --ink-light: #8a8680;
      --paper: #faf8f4;
      --paper-warm: #f2ede4;
      --accent: #c0392b;
      --accent-light: #e8d5d3;
      --green: #2e7d52;
      --green-light: #d4ede0;
      --border: #ddd8cf;
      --shadow: 0 2px 12px rgba(26,24,20,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 200px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--paper);
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── Header（所有页面共用，带返回键） ── */
    .header {
      padding: 12px 18px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--paper-warm);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .header-text { min-width: 0; }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--ink);
    }
    .header-sub {
      font-size: 11px;
      color: var(--ink-light);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }
    .back-btn {
      width: 24px; height: 24px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      color: var(--ink-mid);
      flex-shrink: 0;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .lang-toggle {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .lang-toggle label { font-size: 10px; color: var(--ink-light); cursor: pointer; }
    .lang-switch {
      appearance: none;
      width: 32px; height: 18px;
      background: var(--ink-light);
      border-radius: 9px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .lang-switch::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: left 0.2s;
    }
    .lang-switch:checked { background: var(--accent); }
    .lang-switch:checked::after { left: 16px; }

    /* ── 页面（每次只显示一个） ── */
    .page { padding: 14px 18px 18px; }

    /* ── 表单通用 ── */
    .field-label {
      font-size: 11px;
      color: var(--ink-light);
      margin-bottom: 4px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }
    .field-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }
    .field-input:focus { border-color: var(--accent); }
    textarea.field-input {
      resize: vertical;
      min-height: 48px;
      font-family: 'Noto Serif SC', serif;
      line-height: 1.65;
    }
    .field-hint {
      font-size: 10px;
      color: var(--ink-light);
      margin: -6px 0 10px;
      line-height: 1.55;
    }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    /* ── 按钮 ── */
    .btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #a93226; }
    .btn-primary:disabled { background: var(--ink-light); cursor: not-allowed; }
    .btn-secondary { background: var(--paper-warm); color: var(--ink-mid); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--ink-mid); }
    .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; font-weight: 500; }
    .btn-save { background: var(--accent); color: #fff; padding: 8px 16px; font-size: 12px; width: auto; font-weight: 600; }
    .btn-save:hover { background: #a93226; }
    .btn-send { background: var(--green); color: #fff; font-weight: 600; }
    .btn-send:hover { background: #265f40; }

    /* ── 主页 ── */
    .btn-run {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 15px 14px;
      font-size: 14px;
    }
    .btn-run-sub { font-size: 10.5px; font-weight: 400; opacity: 0.85; letter-spacing: 0; }

    .nav-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      transition: all 0.15s;
    }
    .nav-btn:hover { border-color: var(--accent); }
    .nav-icon { font-size: 15px; flex-shrink: 0; }
    .nav-text { flex: 1; min-width: 0; }
    .nav-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); }
    .nav-meta {
      display: block;
      font-size: 10.5px;
      color: var(--ink-light);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-arrow { color: var(--ink-light); font-size: 15px; flex-shrink: 0; }
    .home-hint {
      font-size: 10.5px;
      color: var(--ink-light);
      line-height: 1.7;
      margin-top: 14px;
      text-align: center;
    }

    .notice {
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 11.5px;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .notice-warn { background: #fff8e6; border: 1px solid #f0dcae; color: #8a6d1f; }
    .notice-info { background: var(--green-light); border: 1px solid #b5dcc7; color: var(--green); }
    .notice code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      background: rgba(0,0,0,0.05);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* ── 模型商选择 ── */
    .model-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .model-btn {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--paper);
      font-size: 11px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s;
    }
    .model-btn:hover { border-color: var(--ink-mid); }
    .model-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── 资料页：每个字段一行（标签在左、控件在右、说明跨整行） ── */
    .field-row {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 3px 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .field-row .field-label { margin-bottom: 0; }
    .field-row .field-input { margin-bottom: 0; }
    .field-row .field-hint { grid-column: 1 / -1; margin: 0; }
    .field-row.is-textarea { align-items: start; }
    .field-row.is-textarea .field-label { margin-top: 9px; line-height: 1.4; }

    /* ── 状态 / 加载 ── */
    .status-box {
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .status-loading { background: #eef4ff; color: #1a56c4; border: 1px solid #c5d8f8; }
    .status-error { background: #fff0f0; color: #b91c1c; border: 1px solid var(--accent-light); }
    .status-success { background: var(--green-light); color: var(--green); border: 1px solid #b5dcc7; }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #c5d8f8;
      border-top-color: #1a56c4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      margin-top: 1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 任务页 ── */
    #task-input {
      width: 100%;
      min-height: 118px;          /* 默认任务文案要能一眼看全，不再出现滚动条 */
      max-height: 340px;
      overflow-y: auto;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      font-family: 'Noto Serif SC', serif;
      font-size: 12px;
      line-height: 1.65;
      color: var(--ink);
      resize: vertical;
      outline: none;
    }
    #task-input:focus { border-color: var(--accent); }
    .task-hint { font-size: 10px; color: var(--ink-light); margin-top: 5px; }

    /* 推荐任务：整段提示词都显示出来，点一下填进上面的输入框 */
    .preset-list { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 4px; }
    .preset-item {
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      transition: all 0.15s;
    }
    .preset-item:hover { border-color: var(--accent); }
    .preset-item.active { border-color: var(--accent); background: #fdf5f4; }
    .preset-title {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .preset-text { display: block; font-size: 10.5px; color: var(--ink-mid); line-height: 1.6; }
    .run-row { display: flex; gap: 8px; margin-top: 12px; }
    .run-row .btn { flex: 1; }

    /* ── Agent trace ── */
    .trace { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 8px; }
    .trace-title {
      font-size: 10px;
      color: var(--ink-light);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .trace-row { font-size: 11.5px; line-height: 1.6; margin-bottom: 5px; padding-left: 14px; position: relative; }
    .trace-row::before {
      content: '';
      position: absolute;
      left: 4px; top: 8px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--border);
    }
    .trace-thought { color: var(--ink-mid); font-style: italic; }
    .trace-tool { font-family: 'JetBrains Mono', monospace; color: #1a56c4; word-break: break-all; }
    .trace-tool::before { background: #1a56c4; }
    .trace-obs { color: var(--ink-light); }
    .trace-obs::before { background: var(--green); }
    .trace-final { color: var(--green); font-weight: 600; }
    .trace-final::before { background: var(--green); }
    .trace-error { color: #b91c1c; }
    .trace-error::before { background: #b91c1c; }
    .trace-obs summary {
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-light);
      outline: none;
    }
    .trace-obs pre {
      margin-top: 4px;
      padding: 6px 8px;
      background: var(--paper-warm);
      border-radius: 5px;
      font-size: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 160px;
      overflow: auto;
      font-family: 'JetBrains Mono', monospace;
      color: var(--ink-mid);
    }

    /* ── 结果页 ── */
    .prof-card {
      background: var(--paper-warm);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .prof-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .prof-email { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-bottom: 6px; }
    .prof-research { font-size: 12px; color: var(--ink-mid); line-height: 1.65; }
    .research-tag {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      margin: 2px 2px 0 0;
    }
    .email-section { margin-bottom: 12px; }
    .email-label {
      font-size: 11px;
      color: var(--ink-light);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .email-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-family: 'Noto Serif SC', serif;
      font-size: 12px;
      color: var(--ink);
      outline: none;
      margin-bottom: 8px;
    }
    .email-input:focus { border-color: var(--accent); }
    #email-to, #email-subject { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
    .email-body-textarea {
      width: 100%;
      height: 200px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-family: 'Noto Serif SC', serif;
      font-size: 12px;
      color: var(--ink);
      line-height: 1.7;
      outline: none;
      resize: vertical;
    }
    .email-body-textarea:focus { border-color: var(--accent); }
    .action-row { display: flex; gap: 8px; margin-top: 8px; }
    .action-row .btn { flex: 1; }

    /* ── 导师库 ── */
    .pipeline-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .pipeline-count { font-size: 11px; color: var(--ink-light); font-family: 'JetBrains Mono', monospace; }
    .prof-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .prof-row-main { flex: 1; min-width: 0; }
    .prof-row-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prof-row-meta {
      font-size: 10px;
      color: var(--ink-light);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-select {
      font-size: 10px;
      font-family: 'Noto Serif SC', serif;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      padding: 2px 3px;
      color: var(--ink-mid);
      outline: none;
      max-width: 76px;
    }
    .status-select:focus { border-color: var(--accent); }
    .icon-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      width: 22px; height: 22px;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      color: var(--ink-mid);
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .empty-hint { font-size: 11.5px; color: var(--ink-light); line-height: 1.7; padding: 10px 0; }

    /* ── 资料页 ── */
    .autosave-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .autosave-tip { font-size: 10.5px; color: var(--ink-light); font-family: 'JetBrains Mono', monospace; }
    .autosave-tip.ok { color: var(--green); }
    .autosave-tip.bad { color: #b91c1c; }

    /* ── 设置链接 ── */
    .settings-link {
      font-size: 11px;
      color: var(--ink-light);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .settings-link:hover { color: var(--ink-mid); }

    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn hidden" id="header-back" data-i18n-title="back">←</button>
  <div class="header-icon">✉</div>
  <div class="header-text">
    <div class="header-title">mail2professor</div>
    <div class="header-sub" id="header-sub"></div>
  </div>
  <div class="lang-toggle">
    <label for="lang-switch">EN</label>
    <input type="checkbox" id="lang-switch" class="lang-switch" />
  </div>
</div>

<!-- ① 主页：刻意保持极简，只放一个主操作 + 各功能入口 -->
<section class="page" id="page-home">
  <div id="status-area"></div>
  <div id="home-notice"></div>

  <button class="btn btn-primary btn-run" id="go-task-btn">
    <span data-i18n="runTitle">✉️ 生成联系邮件</span>
    <span class="btn-run-sub" data-i18n="runSub">读当前页面 → 存导师库 → 起草邮件</span>
  </button>

  <div class="nav-list">
    <button class="nav-btn" data-goto="crm">
      <span class="nav-icon">📚</span>
      <span class="nav-text">
        <span class="nav-label" data-i18n="navCrm">导师库</span>
        <span class="nav-meta" id="home-crm-meta"></span>
      </span>
      <span class="nav-arrow">›</span>
    </button>

    <button class="nav-btn" data-goto="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-text">
        <span class="nav-label" data-i18n="navProfile">我的资料</span>
        <span class="nav-meta" id="home-profile-meta"></span>
      </span>
      <span class="nav-arrow">›</span>
    </button>

    <button class="nav-btn" data-goto="model">
      <span class="nav-icon">⚙️</span>
      <span class="nav-text">
        <span class="nav-label" data-i18n="navModel">模型设置</span>
        <span class="nav-meta" id="home-model-meta"></span>
      </span>
      <span class="nav-arrow">›</span>
    </button>
  </div>

  <div class="home-hint" data-i18n="homeHint">
    在导师主页（或院系师资列表页）上打开这个侧边栏，点上面的按钮即可。
  </div>
</section>

<!-- ② 任务页 -->
<section class="page hidden" id="page-task">
  <div id="task-status-area"></div>

  <div class="field-label" data-i18n="taskLabel">给 agent 的任务</div>
  <textarea id="task-input"></textarea>
  <div class="task-hint" data-i18n="taskEditableHint">可以直接改写这段任务描述，agent 会按你的要求做。</div>
  <div class="preset-list" id="task-chips"></div>

  <div class="run-row">
    <button class="btn btn-primary" id="run-btn" data-i18n="runBtn">▶ 开始</button>
    <button class="btn btn-secondary hidden" id="stop-btn" data-i18n="stopBtn">■ 停止</button>
  </div>

  <div class="trace hidden" id="trace-panel">
    <div class="trace-title" id="trace-title">AGENT TRACE</div>
    <div id="trace-body"></div>
  </div>
</section>

<!-- ③ 邮件确认页 -->
<section class="page hidden" id="page-result">
  <div id="result-notice"></div>
  <div class="prof-card" id="prof-info-card">
    <div class="prof-name" id="prof-name-el">—</div>
    <div class="prof-email" id="prof-email-el"></div>
    <div id="prof-tags-el"></div>
    <div class="prof-research" id="prof-research-el" style="margin-top:6px"></div>
  </div>

  <div class="email-section">
    <div class="email-label" data-i18n="toLabel">收件人</div>
    <input class="email-input" type="text" id="email-to" placeholder="professor@university.edu" />
    <div class="email-label" data-i18n="subjectLabel">邮件主题</div>
    <input class="email-input" type="text" id="email-subject" />
    <div class="email-label" data-i18n="bodyLabel">邮件正文</div>
    <textarea class="email-body-textarea" id="email-body"></textarea>
  </div>

  <div class="action-row">
    <button class="btn btn-send" id="send-btn" data-i18n="sendEmail">📨 打开邮件客户端</button>
    <button class="btn btn-secondary" id="copy-btn" data-i18n="copyToClipboard">📋 复制邮件</button>
  </div>
  <div class="action-row">
    <button class="btn btn-secondary" id="mark-contacted-btn" data-i18n="markContacted">✓ 标记为已联系</button>
    <button class="btn btn-secondary" id="result-back-btn" data-i18n="backToTask">← 返回任务</button>
  </div>
</section>

<!-- ④ 导师库 -->
<section class="page hidden" id="page-crm">
  <div class="pipeline-head">
    <div class="pipeline-count" id="pipeline-count"></div>
    <button class="btn btn-secondary btn-sm" id="export-btn" data-i18n="exportBtn">导出 JSON</button>
  </div>
  <div id="pipeline-list"></div>
</section>

<!-- ⑤ 我的资料 -->
<section class="page hidden" id="page-profile">
  <div id="profile-form"></div>
  <div class="autosave-row">
    <button class="btn btn-secondary btn-sm" id="profile-save-btn" data-i18n="saveBtn">保存</button>
    <span class="autosave-tip" id="profile-tip"></span>
  </div>
</section>

<!-- ⑥ 模型设置 -->
<section class="page hidden" id="page-model">
  <div id="model-notice"></div>

  <div class="field-label" data-i18n="providerLabel">选择模型商</div>
  <div class="model-selector" id="model-provider-selector"></div>

  <div class="field-label">API KEY</div>
  <input class="field-input" type="password" id="model-api-key" placeholder="sk-..." />
  <div class="field-hint" data-i18n="keyHint">每个厂商的 Key 分开保存（切厂商不会互相覆盖），只存在本机浏览器里。</div>
  <div style="margin:-6px 0 10px">
    <span class="settings-link hidden" id="model-clear-key" data-i18n="clearKey">清除本厂商的 Key</span>
  </div>

  <div class="field-label">BASE URL</div>
  <input class="field-input" type="text" id="model-base-url" placeholder="https://api.deepseek.com/v1" />

  <div class="field-label" data-i18n="modelLabel">模型</div>
  <input class="field-input" type="text" id="model-name" placeholder="deepseek-chat" />

  <div class="field-label" data-i18n="maxSteps">单次任务最大步数</div>
  <input class="field-input" type="number" id="model-max-steps" min="1" max="30" />

  <div class="autosave-row">
    <button class="btn btn-save" id="model-save-btn" data-i18n="saveBtn">保存</button>
    <span class="autosave-tip" id="model-tip"></span>
  </div>
</section>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
